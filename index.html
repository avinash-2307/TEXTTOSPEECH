<!DOCTYPE html>
<html>
<head>
    <title>Text to Speech Helper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Text to Speech Notebook Helper</h1>

        <textarea id="textInput" placeholder="Enter your text here"></textarea>

        <label>Words Before Pause:</label>
        <input type="number" id="wordsPerGroup" value="3">

        <label>Pause Duration (seconds):</label>
        <input type="number" id="pauseTime" value="2">

        <label>Speech Speed:</label>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">

        <label>Select Voice:</label>
        <select id="voiceSelect"></select>


        <button onclick="startSpeech()">Start</button>
        <button onclick="pauseSpeech()">Pause</button>
        <button onclick="resumeSpeech()">Resume</button>
        <button onclick="stopSpeech()">Stop</button>

        <div class="progress-container">
        <div id="progressBar"></div>
        </div>

    <div id="currentWords"></div>

        <h3 id="sessionInfo"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
